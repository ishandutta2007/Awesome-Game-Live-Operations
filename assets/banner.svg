<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#fb923c"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.3}}@keyframes float{0%{transform:translateY(0)}}.subtitle,.tag,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:900;font-size:52px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:22px;fill:#cbd5e1}.tag{font-weight:700;font-size:14px;fill:#fff;letter-spacing:1.5px}.pulse-circle{animation:pulse 4s infinite alternate ease-in-out}.float-grid{animation:float 6s infinite alternate ease-in-out}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g class="float-grid" opacity=".25"><circle cx="150" cy="80" r="120" fill="#6366f1" class="pulse-circle" style="transform-origin:150px 80px"/><circle cx="1050" cy="220" r="150" fill="#a855f7" class="pulse-circle" style="transform-origin:1050px 220px"/><path stroke="#fff" stroke-dasharray="4 8" stroke-width=".5" d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250" opacity=".3"/><path stroke="#fff" stroke-dasharray="4 8" stroke-width=".5" d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300 M 800 0 L 800 300 M 900 0 L 900 300 M 1000 0 L 1000 300 M 1100 0 L 1100 300" opacity=".3"/></g><path fill="none" stroke="url(#accentGrad)" stroke-width="3" d="M 80 240 Q 300 280 600 240 T 1120 240" filter="url(#glow)" opacity=".7"/><g transform="translate(80, 50)"><rect width="180" height="32" fill="url(#accentGrad)" rx="16"/><text x="90" y="21" class="tag" text-anchor="middle">GAMEDEV &amp; LIVEOPS</text></g><text x="80" y="145" class="title" filter="url(#glow)">Awesome Game Live Operations 🚀</text><text x="80" y="195" class="subtitle">Curated Ecosystem of SaaS Platforms &amp; Open-Source Projects for Game Live Services</text><g transform="translate(980, 50)"><rect width="140" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><circle cx="22" cy="16" r="5" fill="#22c55e"/><text x="75" y="21" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">UPDATED 2026</text></g></svg>