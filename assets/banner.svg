<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 52px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #cbd5e1;
    }
    .tag {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: 1.5px;
    }
    .pulse-circle {
      animation: pulse 4s infinite alternate ease-in-out;
    }
    .float-grid {
      animation: float 6s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Background Geometric Elements (Behind Text) -->
  <g opacity="0.25" class="float-grid">
    <circle cx="150" cy="80" r="120" fill="#6366f1" class="pulse-circle" style="transform-origin: 150px 80px;" />
    <circle cx="1050" cy="220" r="150" fill="#a855f7" class="pulse-circle" style="transform-origin: 1050px 220px;" />
    
    <!-- Grid pattern -->
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3" />
    <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300 M 800 0 L 800 300 M 900 0 L 900 300 M 1000 0 L 1000 300 M 1100 0 L 1100 300" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3" />
  </g>

  <!-- Glowing Accent Lines -->
  <path d="M 80 240 Q 300 280 600 240 T 1120 240" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.7" filter="url(#glow)" />

  <!-- Foreground Content (Guaranteed crisp and visible) -->
  <!-- Category Tag Badge -->
  <g transform="translate(80, 50)">
    <rect width="180" height="32" rx="16" fill="url(#accentGrad)" />
    <text x="90" y="21" text-anchor="middle" class="tag">GAMEDEV &amp; LIVEOPS</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="145" class="title" filter="url(#glow)">Awesome Game Live Operations 🚀</text>
  <text x="80" y="195" class="subtitle">Curated Ecosystem of SaaS Platforms &amp; Open-Source Projects for Game Live Services</text>

  <!-- Decorative Live Status Pill -->
  <g transform="translate(980, 50)">
    <rect width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="22" cy="16" r="5" fill="#22c55e" />
    <text x="75" y="21" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">UPDATED 2026</text>
  </g>
</svg>
